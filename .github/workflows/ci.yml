name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # installs erlang, elixir and zig at the versions pinned in mise.toml
      - uses: jdx/mise-action@v2
        with:
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/test/curl_impersonate
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mix.lock') }}

      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
